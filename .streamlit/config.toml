# Committed. Real secrets live in .streamlit/secrets.toml, which is gitignored.

[theme]
base = "dark"
primaryColor = "#3d8bcd"

[server]
# Matches MAX_FILE_MB in config.py. Streamlit rejects larger uploads before our own check runs,
# so these two numbers must agree or the app's error message would never be reached.
maxUploadSize = 5
# Both left at their secure defaults. An earlier version of this file set
# enableCORS = false, which Streamlit warns about: with CORS disabled it sends
# `Access-Control-Allow-Origin: *` and accepts a WebSocket connection from any origin, and XSRF
# protection does not cover WebSocket upgrades. There is no reason to relax either here.
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
# Hides the "Deploy" and source-view menu items from viewers of the shared link.
toolbarMode = "minimal"
showErrorDetails = false
